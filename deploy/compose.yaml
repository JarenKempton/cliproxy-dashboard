# Runs next to CLIProxyAPI. The dashboard joins the tailnet as its own machine
# and is served at https://cliproxy-dashboard.<tailnet>.ts.net.
#
# $DATA holds: env (CPA_MANAGEMENT_KEY, CPA_TARGET, TAILNET_PROXY_URL,
# TAILNET_DASHBOARD_URL), ts-authkey, data/, backups/, tailscale/.
services:
  tailscale:
    image: tailscale/tailscale:v1.102.5
    network_mode: host
    restart: unless-stopped
    environment:
      TS_HOSTNAME: cliproxy-dashboard
      TS_AUTHKEY: file:/secrets/ts-authkey
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_SERVE_CONFIG: /config/serve.json
      TS_TAILSCALED_EXTRA_ARGS: --port=0
    volumes:
      - ${DATA}/tailscale:/var/lib/tailscale
      - ${DATA}/ts-authkey:/secrets/ts-authkey:ro
      - ${DATA}/serve.json:/config/serve.json:ro
      - socket:/var/run/tailscale

  dashboard:
    image: ghcr.io/jarenkempton/cliproxy-dashboard:main
    network_mode: host
    restart: unless-stopped
    env_file: ${DATA}/env
    volumes:
      - ${DATA}/data:/app/data
      - ${DATA}/backups:/app/.backups
      - socket:/var/run/tailscale

volumes:
  socket:
