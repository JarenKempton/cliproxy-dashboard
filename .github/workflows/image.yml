name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/jarenkempton/cliproxy-dashboard:main
            ghcr.io/jarenkempton/cliproxy-dashboard:${{ github.sha }}
      - name: Deploy to trash-pro
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          body='{"app":"cliproxy-dashboard"}'
          ts=$(date +%s)
          sig=$(printf '%s' "$ts.$body" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -hex | sed 's/.* //')
          job=$(curl -fsS -H "X-Deploy-Timestamp: $ts" -H "X-Deploy-Signature: $sig" -d "$body" https://hooks.jarenkempton.dev/deploy | jq -r .job)
          for _ in $(seq 60); do
            read -r state error < <(curl -fsS "https://hooks.jarenkempton.dev/deploy/jobs/$job" | jq -r '[.state, (.error // "")] | @tsv')
            case "$state" in
              SUCCESS) echo "deployed (job $job)"; exit 0 ;;
              FAILED|ABORTED) echo "deploy failed: $error"; exit 1 ;;
            esac
            sleep 5
          done
          echo "deploy timed out (job $job)"; exit 1
